<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
  </head>
  <body>
    <div class="parent">
      <div class="child" id="child1"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
    </div>
  </body>
</html>

<style>
  .parent {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .child {
    height: 100px;
    background-color: lightcoral;
  }
  #child1 {
    grid-column: 1/3;
  }
</style>
