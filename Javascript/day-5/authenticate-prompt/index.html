<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticate y prompt</title>
  </head>
  <body>
    <script>
      alert("please enter 'admin' as username and 'password' as password to authenticate.");

      const username = prompt('Enter your username:');
      const password = prompt('Enter your password:');
      function greetUser(name) {
        return `Welcome, <span style="color: green; text-decoration: underline; text-transform: capitalize;">${name}</span>!`;
      }

      function getRandomDogs(url, callback) {
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            callback(data);
          })
          .catch((error) => {
            console.error('Error fetching dog image:', error);
          });
      }
      function showFailed() {
        document.body.style.backgroundColor = '#000';
        document.body.innerHTML += `
          <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmgzNG5oOGxsN21qd21jMWp6ZXVsb253bnZtY2g5YTZhMjRiNjY1dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o6ZsX2k0J8x7G8y4A/giphy.gif" alt="sad dog" style="max-width: 100%; height: 100vh;">
        `;
      }
      if (!username || !password) {
        alert('Please enter both username and password. ❌');
        showFailed();
      } else if (username.toLowerCase() === 'admin' && password.toLowerCase() === 'password') {
        alert('Authentication successful! ✅');
        document.body.style.backgroundColor = 'lightgreen';
        getRandomDogs('https://dog.ceo/api/breeds/image/random', (data) => {
          document.body.innerHTML += `
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmgzNG5oOGxsN21qd21jMWp6ZXVsb253bnZtY2g5YTZhMjRiNjY1dSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/oF6TOssuzqVmbYE70d/giphy.gif" alt="viral dance " width="300px" height="300px" style="margin-top: 20px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); border: 2px solid #ccc; border-radius: 10px; margin-bottom: 20px;">
          `;
          document.body.innerHTML += `
            <h1>${greetUser(data.message.split('/')[4])}</h1>
            <img src="${data.message}" alt="Random Dog" style="max-width: 100%; height: 80vh; margin-top: 20px; ">

          `;
        });
      } else {
        alert('Invalid credentials. ❌, please try again.');
        showFailed();
      }
    </script>
  </body>
</html>
